<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名表單 — 個人介紹</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --black: #111111;
    --white: #ffffff;
    --grey: #6f6f6f;
    --line: #d9d9d9;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  html, body {
    background: var(--white);
    color: var(--black);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  body {
    max-width: 880px;
    margin: 0 auto;
    padding: 80px 32px 120px;
    position: relative;
  }

  .decor {
    position: absolute;
    top: 0;
    right: -40px;
    width: 220px;
    z-index: -1;
    filter: grayscale(100%) contrast(1.05);
    opacity: 0.9;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    .decor {
      width: 130px;
      right: -20px;
    }
  }

  /* ---------- Header ---------- */
  header {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 56px;
    align-items: end;
    padding-bottom: 48px;
    border-bottom: 1px solid var(--line);
  }

  .avatar {
    width: 220px;
    height: 220px;
    border: 1px solid var(--black);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .avatar::before,
  .avatar::after {
    content: "";
    position: absolute;
    background: var(--line);
  }
  .avatar::before { width: 100%; height: 1px; top: 50%; }
  .avatar::after { height: 100%; width: 1px; left: 50%; }

  .avatar span {
    position: relative;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--grey);
    background: var(--white);
    padding: 4px 10px;
  }

  .heading h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  .heading .role {
    margin-top: 14px;
    font-size: 16px;
    color: var(--grey);
    font-weight: 400;
  }

  .heading .role em {
    font-style: normal;
    color: var(--black);
    font-weight: 500;
  }

  nav {
    margin-top: 20px;
    display: flex;
    gap: 24px;
  }

  nav a {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--grey);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  nav a:hover {
    color: var(--black);
    border-bottom-color: var(--black);
  }

  /* ---------- Sections ---------- */
  section {
    padding-top: 48px;
    padding-bottom: 48px;
    border-bottom: 1px solid var(--line);
  }

  section:last-of-type {
    border-bottom: none;
  }

  .section-grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 56px;
  }

  .section-label {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--black);
  }

  .section-content p {
    font-size: 16px;
    line-height: 1.9;
    color: #333333;
    max-width: 62ch;
    font-weight: 300;
  }

  .section-content p + p {
    margin-top: 16px;
  }

  /* ---------- Interests as a list, not cards ---------- */
  .interest-list {
    list-style: none;
  }

  .interest-list li {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 24px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    font-size: 16px;
  }

  .interest-list li:first-child {
    border-top: none;
  }

  .interest-list .name {
    font-weight: 500;
    color: var(--black);
  }

  .interest-list .desc {
    color: var(--grey);
    font-weight: 300;
  }

  /* ---------- Signup Form ---------- */
  .signup-form {
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-row label {
    font-size: 14px;
    color: var(--black);
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .form-row .required {
    color: var(--grey);
    font-weight: 400;
  }

  .form-row input,
  .form-row textarea {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--black);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.15s ease;
    resize: vertical;
  }

  .form-row input:focus,
  .form-row textarea:focus {
    border-bottom-color: var(--black);
  }

  .field-hint {
    font-size: 13px;
    min-height: 16px;
    color: var(--grey);
  }

  .field-hint.valid {
    color: #2f7a3d;
  }

  .field-hint.invalid {
    color: #b3261e;
  }

  .form-row input.valid {
    border-bottom-color: #2f7a3d;
  }

  .form-row input.invalid {
    border-bottom-color: #b3261e;
  }

  .signup-form button[type="submit"] {
    align-self: flex-start;
    margin-top: 8px;
    padding: 12px 32px;
    background: var(--black);
    color: var(--white);
    border: 1px solid var(--black);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .signup-form button[type="submit"]:hover {
    background: var(--white);
    color: var(--black);
  }

  .signup-form button[type="submit"]:disabled {
    background: var(--line);
    border-color: var(--line);
    color: var(--grey);
    cursor: not-allowed;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 17, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-overlay[hidden] {
    display: none;
  }

  .modal-box {
    position: relative;
    background: var(--white);
    border: 1px solid var(--black);
    padding: 36px 48px;
    min-width: 240px;
    text-align: center;
  }

  .modal-box p {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--black);
  }

  .modal-close {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    color: var(--grey);
    cursor: pointer;
  }

  .modal-close:hover {
    color: var(--black);
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--grey);
    letter-spacing: 0.02em;
  }

  footer a {
    color: var(--black);
    text-decoration: none;
    border-bottom: 1px solid var(--black);
    padding-bottom: 1px;
  }

  /* ---------- Stack horizontal blocks below 768px ---------- */
  @media (max-width: 768px) {
    header {
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .section-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .interest-list li {
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .index-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    body { padding: 48px 20px 80px; }

    header {
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .avatar {
      width: 140px;
      height: 140px;
    }

    .heading h1 { font-size: 38px; }

    .section-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .interest-list li {
      grid-template-columns: 1fr;
      gap: 4px;
    }

    footer {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
  }


  /* ---------- Index / Directory page ---------- */
  .index-hero {
    padding-bottom: 48px;
    border-bottom: 1px solid var(--line);
  }

  .index-hero h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 48px;
    line-height: 1.1;
  }

  .index-hero p {
    margin-top: 14px;
    font-size: 16px;
    color: var(--grey);
  }

  .index-grid {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .index-card {
    display: block;
    border: 1px solid var(--line);
    padding: 32px 24px;
    text-decoration: none;
    color: var(--black);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .index-card:hover {
    border-color: var(--black);
    transform: translateY(-2px);
  }

  .index-card .num {
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    color: var(--grey);
    letter-spacing: 0.06em;
  }

  .index-card h2 {
    margin-top: 14px;
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 600;
  }

  .index-card p {
    margin-top: 10px;
    font-size: 14px;
    color: var(--grey);
    line-height: 1.7;
  }

  @media (max-width: 640px) {
    .index-hero h1 { font-size: 34px; }
    .index-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ---------- Shared page nav (top of sub-pages) ---------- */
  .page-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 32px;
    margin-bottom: 48px;
    border-bottom: 1px solid var(--line);
  }

  .page-nav .links {
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .page-nav .links a {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--grey);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .page-nav .links a:hover,
  .page-nav .links a.active {
    color: var(--black);
    border-bottom-color: var(--black);
  }

  .page-title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 40px;
    line-height: 1.1;
    margin-bottom: 48px;
  }
</style>
</head>

  <h1 class="page-title">報名表單</h1>

  <main>
    <section id="signup" style="border-bottom:none;">
      <article>
        <div class="section-grid">
          <div class="section-label">報名表單</div>
          <div class="section-content">
            <form class="signup-form" novalidate>
              <div class="form-row">
                <label for="signup-name">姓名 <span class="required">*</span></label>
                <input type="text" id="signup-name" name="name" required autocomplete="name">
              </div>

              <div class="form-row">
                <label for="signup-email">Email <span class="required">*</span></label>
                <input type="email" id="signup-email" name="email" required autocomplete="email" aria-describedby="email-hint">
                <p class="field-hint" id="email-hint" aria-live="polite"></p>
              </div>

              <div class="form-row">
                <label for="signup-phone">聯絡電話</label>
                <input type="tel" id="signup-phone" name="phone" autocomplete="tel">
              </div>

              <div class="form-row">
                <label for="signup-note">備註</label>
                <textarea id="signup-note" name="note" rows="4"></textarea>
              </div>

              <button type="submit">送出報名</button>
            </form>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div class="modal-overlay" id="submit-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close-btn" aria-label="關閉">&times;</button>
      <p id="modal-title">已送出報名</p>
    </div>
  </div>

  <footer>
    <span>Personal Profile — 2026</span>
    <a href="mailto:example@mail.com">example@mail.com</a>
  </footer>

  <script>
    (function () {
      var emailInput = document.getElementById('signup-email');
      var emailHint = document.getElementById('email-hint');
      if (!emailInput || !emailHint) return;
      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      emailInput.addEventListener('input', function () {
        var value = emailInput.value.trim();
        emailInput.classList.remove('valid', 'invalid');
        if (value === '') {
          emailHint.textContent = '';
          emailHint.className = 'field-hint';
          return;
        }
        var isValid = emailPattern.test(value);
        emailInput.classList.add(isValid ? 'valid' : 'invalid');
        emailHint.textContent = isValid
          ? 'Email 格式正確'
          : 'Email 格式不正確，請確認格式，例如 name@example.com';
        emailHint.className = 'field-hint ' + (isValid ? 'valid' : 'invalid');
      });
    })();

    (function () {
      var form = document.querySelector('.signup-form');
      var submitBtn = form ? form.querySelector('button[type="submit"]') : null;
      var modal = document.getElementById('submit-modal');
      var closeBtn = document.getElementById('modal-close-btn');
      if (!form || !submitBtn || !modal || !closeBtn) return;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = '已送出報名';
        modal.hidden = false;
      });

      closeBtn.addEventListener('click', function () {
        modal.hidden = true;
      });

      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.hidden = true;
      });
    })();
  </script>
